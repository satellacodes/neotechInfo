[env:esp32dev]
platform = espressif32@^6.8.1
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed  = 921600

; --- Optimasi ukuran & hemat daya ---
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -O2
    -ffunction-sections
    -fdata-sections
    -Wl,--gc-sections
    -DARDUINO_USB_CDC_ON_BOOT=0
build_unflags = -Os

; --- Dependensi ---
lib_deps =
    olikraus/U8g2@^2.35.19
    h2zero/NimBLE-Arduino@^2.1.2
    bblanchon/ArduinoJson@^7.0.4

board_build.flash_mode = qio
