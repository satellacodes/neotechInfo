name: Build Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "neotechApp/**"
      - ".github/workflows/build-android.yml"
  pull_request:
    paths: ["neotechApp/**"]
  workflow_dispatch:

permissions:
  contents: write # dibutuhkan untuk membuat GitHub Release saat push tag

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: neotechApp
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: neotechApp/pnpm-lock.yaml

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prebuild native project
        run: pnpm exec expo prebuild --platform android --clean --no-install

      - name: Build release APK (arm64)
        working-directory: neotechApp/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Rename APK
        id: apk
        run: |
          mkdir -p dist
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then TAG="${GITHUB_REF_NAME}"; else TAG="dev-${GITHUB_SHA::7}"; fi
          NAME="GLPro-Neotech-${TAG}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "dist/${NAME}"
          echo "path=neotechApp/dist/${NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GLPro-Neotech-apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
