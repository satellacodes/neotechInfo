name: Build Firmware (NAV)

on:
  push:
    branches: [main, master]
    paths:
      - "fimwareOnlyNAV/**"
      - ".github/workflows/build-fimwareOnlyNAV.yml"
    tags: ["nav-v*"]
  pull_request:
    paths: ["fimwareOnlyNAV/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nav-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: fimwareOnlyNAV
    steps:
      - uses: actions/checkout@v4

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: ${{ runner.os }}-pio-nav-${{ hashFiles('fimwareOnlyNAV/platformio.ini') }}
          restore-keys: ${{ runner.os }}-pio-nav-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Build
        run: pio run -e esp32dev

      - name: Collect binary
        id: bin
        run: |
          mkdir -p dist
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="dev-${GITHUB_SHA::7}"
          fi
          NAME="GLPro-Neotech-NAV-${TAG}.bin"
          cp .pio/build/esp32dev/firmware.bin "dist/${NAME}"   
          echo "path=fimwareOnlyNAV/dist/${NAME}" >> "$GITHUB_OUTPUT"
          ls -la dist/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GLPro-Neotech-NAV
          path: |
            ${{ steps.bin.outputs.path }}
            fimwareOnlyNAV/.pio/build/esp32dev/firmware.elf
            fimwareOnlyNAV/.pio/build/esp32dev/bootloader.bin
            fimwareOnlyNAV/.pio/build/esp32dev/partitions.bin
          if-no-files-found: error
          retention-days: 30

      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/nav-v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "Neotech NAV ${{ github.ref_name }}"
          files: |
            ${{ steps.bin.outputs.path }}
            fimwareOnlyNAV/.pio/build/esp32dev/bootloader.bin
            fimwareOnlyNAV/.pio/build/esp32dev/partitions.bin
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
