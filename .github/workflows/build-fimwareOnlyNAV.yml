name: Build Fimware (NAV)

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: fimwareOnlyNAV

    steps:
      - uses: actions/checkout@v4

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('fimwareOnlyNAV/platformio.ini') }}
          restore-keys: ${{ runner.os }}-pio-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Build
        run: pio run -e esp32dev

      - name: Upload Fimware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32dev
          path: |
            fimwareOnlyNAV/.pio/build/esp32dev/fimware.bin
            fimwareOnlyNAV/.pio/build/esp32dev/fimware.elf
            fimwareOnlyNAV/.pio/build/esp32dev/bootloader.bin
            fimwareOnlyNAV/.pio/build/esp32dev/partitions.bin
          if-no-files-found: error

      - name: Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            fimwareOnlyNAV/.pio/build/esp32dev/fimware.bin
            fimwareOnlyNAV/.pio/build/esp32dev/bootloader.bin
            fimwareOnlyNAV/.pio/build/esp32dev/partitions.bin
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
