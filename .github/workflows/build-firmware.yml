name: Build Firmware (ESP32)

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "fimware/**"
      - ".github/workflows/build-firmware.yml"
  pull_request:
    paths: ["fimware/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('fimware/platformio.ini') }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install platformio

      - name: Compile
        run: pio run -d fimware

      - name: Collect binary
        id: bin
        run: |
          mkdir -p dist
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then TAG="${GITHUB_REF_NAME}"; else TAG="dev-${GITHUB_SHA::7}"; fi
          NAME="GLPro-Neotech-firmware-${TAG}.bin"
          cp fimware/.pio/build/esp32dev/firmware.bin "dist/${NAME}"
          echo "path=dist/${NAME}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: GLPro-Neotech-firmware
          path: ${{ steps.bin.outputs.path }}
          retention-days: 30

      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.bin.outputs.path }}
