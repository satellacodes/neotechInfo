name: Build Firmware (ESP32)

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "fimware/**"
      - ".github/workflows/build-firmware.yml"
  pull_request:
    paths: ["fimware/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('fimware/platformio.ini') }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install platformio

      - name: Compile (coba ulang bila registry PlatformIO gagal sesaat)
        run: |
          for i in 1 2 3 4; do
            pio run -d fimware && exit 0
            echo "Percobaan $i gagal, ulangi dalam 20 detik..."
            sleep 20
          done
          exit 1

      - name: Collect binary
        id: bin
        run: |
          mkdir -p dist
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then TAG="${GITHUB_REF_NAME}"; else TAG="dev-${GITHUB_SHA::7}"; fi
          NAME="GLPro-Neotech-firmware-${TAG}.bin"
          B=fimware/.pio/build/esp32dev
          PK=~/.platformio/packages
          # satu file lengkap (bootloader + partisi + aplikasi): flash di alamat 0x0
          python "$PK/tool-esptoolpy/esptool.py" --chip esp32 merge_bin -o "dist/${NAME}" \
            --flash_mode dio --flash_freq 40m --flash_size 4MB \
            0x1000 "$B/bootloader.bin" 0x8000 "$B/partitions.bin" \
            0xe000 "$PK/framework-arduinoespressif32/tools/partitions/boot_app0.bin" \
            0x10000 "$B/firmware.bin"
          echo "path=dist/${NAME}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: GLPro-Neotech-firmware
          path: ${{ steps.bin.outputs.path }}
          retention-days: 30

      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.bin.outputs.path }}
